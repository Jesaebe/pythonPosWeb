version: '3.1'

services:
  jogatina:
    build: .
    image: noticias
    container_name: jogatina
    hostname: jogatinas
    restart: always
    volumes:
      - ./servicos/jogatina:/servico
    command: python3 /servico/servico.py
    ports:
      - 5001:5000

  sistemas:
    build: .
    image: noticias
    container_name: sistemas
    hostname: sistemas
    restart: always
    volumes:
      - ./servicos/sistemas:/servico
    command: python3 /servico/servico.py
    ports:
      - 5002:5000